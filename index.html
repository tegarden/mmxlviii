<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f3eb">
<title>MMXLVIII · 2048</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='5' fill='%23b9c0b0'/%3E%3Crect x='4' y='4' width='26' height='26' rx='3' fill='%23f1efe5'/%3E%3Crect x='34' y='4' width='26' height='26' rx='3' fill='%23cdd2c4'/%3E%3Crect x='4' y='34' width='26' height='26' rx='3' fill='%23e7e7cb'/%3E%3Crect x='34' y='34' width='26' height='26' rx='3' fill='%23c6d5a1'/%3E%3Cg fill='%23303d36' font-family='system-ui,sans-serif' font-size='23' font-weight='750' text-anchor='middle'%3E%3Ctext x='17' y='25'%3E2%3C/text%3E%3Ctext x='17' y='55'%3E4%3C/text%3E%3Ctext x='47' y='55'%3E8%3C/text%3E%3C/g%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #f6f3eb; color: #303d36; font-family: ui-sans-serif, system-ui, sans-serif; display: grid; place-items: center; }
  /* 100 units wide × 119 units tall, fitted to both viewport axes. */
  main { width: min(94vw, 79vh); width: min(94vw, 79dvh); container-type: inline-size; }
  header { height: 19cqw; display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 8cqw; line-height: 1; letter-spacing: -.07em; margin: 0; }
  .scores { display: flex; gap: 2cqw; align-items: stretch; }
  .score { width: 18cqw; height: 11cqw; padding: 2cqw; background: #e9e8df; border-radius: 1.5cqw; text-align: center; }
  .score span { display: block; font-size: 1.8cqw; letter-spacing: .12em; text-transform: uppercase; }
  .score strong { display: block; font-size: 3.5cqw; font-variant-numeric: tabular-nums; }
  .arena { width: 100%; aspect-ratio: 1; display: grid; grid-template-columns: 8fr 39fr 39fr 8fr; grid-template-rows: 8fr 39fr 39fr 8fr; gap: 2cqw; }
  button { border: 0; cursor: pointer; color: inherit; font: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .arrow { background: #e4e7dd; border-radius: 1.4cqw; font-size: 5cqw; line-height: 1; transition: background .12s, transform .12s; }
  button:hover { background: #d4decc; }
  button:active { transform: scale(.96); }
  button:focus-visible { outline: .6cqw solid #47775d; outline-offset: .3cqw; }
  button:disabled { opacity: .35; cursor: default; }
  .board { grid-column: 2 / 4; grid-row: 2 / 4; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 1.7cqw; padding: 1.7cqw; background: #b9c0b0; border-radius: 2cqw; }
  .tile { display: grid; place-items: center; min-width: 0; border-radius: 1.1cqw; background: #cdd2c4; font-size: 7cqw; font-weight: 750; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
  .tile[data-value="2"] { background: #f1efe5; }
  .tile[data-value="4"] { background: #e7e7cb; }
  .tile[data-value="8"] { background: #c6d5a1; }
  .tile[data-value="16"] { background: #a6c183; }
  .tile[data-value="32"] { background: #7ea46d; color: #fff; }
  .tile[data-value="64"] { background: #527c58; color: #fff; }
  .tile[data-value="128"] { background: #e9c775; }
  .tile[data-value="256"] { background: #e5b55b; }
  .tile[data-value="512"] { background: #d99049; color: #fff; }
  .tile[data-value="1024"] { background: #c4753f; color: #fff; }
  .tile[data-value="2048"] { background: #a45532; color: #fff; }
  .tile.large { font-size: 5cqw; }
  .tile.beyond { background: #303d36; color: #fff; font-size: 4cqw; }
  .tile.spawn { animation: appear .18s ease-out; }
  @keyframes appear { from { transform: scale(.75); opacity: .4; } to { transform: scale(1); opacity: 1; } }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
  .actions { position: relative; display: flex; flex-shrink: 0; }
  #new-game { width: 18cqw; height: 11cqw; border-radius: 1.5cqw; }
  #cancel { position: absolute; top: calc(100% + .5cqw); width: 100%; padding: .4cqw; font-size: 1.8cqw; }
  .action { background: #303d36; color: #fff; border-radius: 1.2cqw; padding: 2cqw 2.5cqw; font-size: 2.2cqw; }
  .action:hover { background: #527c58; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main aria-label="2048 game">
  <header>
    <h1>MMXLVIII<span style="color:#7e9868">.</span></h1>
    <div class="scores"><div class="actions"><button id="new-game" class="action">New game</button><button id="cancel" class="action" hidden>Cancel</button></div><div class="score"><span>Score</span><strong id="score">0</strong></div><div class="score"><span>Best</span><strong id="best">0</strong></div></div>
  </header>
  <div class="arena" aria-label="Board and direction controls">
    <button class="arrow" style="grid-area:1/2" data-direction="left" aria-label="Move left">←</button>
    <button class="arrow" style="grid-area:1/3" data-direction="right" aria-label="Move right">→</button>
    <button class="arrow" style="grid-area:2/1" data-direction="up" aria-label="Move up">↑</button>
    <button class="arrow" style="grid-area:3/1" data-direction="down" aria-label="Move down">↓</button>
    <div id="board" class="board" role="group" aria-label="4 by 4 tile board"></div>
    <button class="arrow" style="grid-area:2/4" data-direction="up" aria-label="Move up">↑</button>
    <button class="arrow" style="grid-area:3/4" data-direction="down" aria-label="Move down">↓</button>
    <button class="arrow" style="grid-area:4/2" data-direction="left" aria-label="Move left">←</button>
    <button class="arrow" style="grid-area:4/3" data-direction="right" aria-label="Move right">→</button>
  </div>
  <p id="status" class="sr-only" role="status" aria-live="polite"></p>
  <p id="storage-note" class="sr-only" role="status" hidden>Storage unavailable. Progress lasts for this session.</p>
</main>
<script>
'use strict';
const STORAGE_KEY = 'mmxlviii.game.v1';
const DIRECTIONS = ['left', 'right', 'up', 'down'];

function slide(board, direction) {
  const next = board.slice();
  let gained = 0;
  for (let line = 0; line < 4; line++) {
    const indices = Array.from({ length: 4 }, (_, position) => {
      const p = direction === 'right' || direction === 'down' ? 3 - position : position;
      return direction === 'left' || direction === 'right' ? line * 4 + p : p * 4 + line;
    });
    const values = indices.map(i => board[i]).filter(Boolean);
    const merged = [];
    for (let i = 0; i < values.length; i++) {
      if (values[i] === values[i + 1]) {
        const value = values[i] * 2;
        merged.push(value);
        gained += value;
        i++;
      } else merged.push(values[i]);
    }
    indices.forEach((index, position) => { next[index] = merged[position] || 0; });
  }
  return { board: next, gained, changed: next.some((value, i) => value !== board[i]) };
}

function canMove(board) { return DIRECTIONS.some(direction => slide(board, direction).changed); }
function validScore(value) { return Number.isSafeInteger(value) && value >= 0; }
function validBoard(board) {
  return Array.isArray(board) && board.length === 16 && board.every(value =>
    value === 0 || (Number.isSafeInteger(value) && value >= 2 && Number.isInteger(Math.log2(value)))) && board.some(Boolean);
}
let state = { board: Array(16).fill(0), score: 0, best: 0 };
let confirming = false;
const boardElement = document.querySelector('#board');
const cells = Array.from({ length: 16 }, () => {
  const cell = document.createElement('div');
  cell.className = 'tile';
  boardElement.append(cell);
  return cell;
});
function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 1, ...state }));
    document.querySelector('#storage-note').hidden = true;
  } catch { document.querySelector('#storage-note').hidden = false; }
}
function spawn() {
  const empty = state.board.map((value, i) => value === 0 ? i : -1).filter(i => i >= 0);
  if (!empty.length) return -1;
  const index = empty[Math.floor(Math.random() * empty.length)];
  state.board[index] = Math.random() < .9 ? 2 : 4;
  return index;
}
function render(spawned = -1) {
  cells.forEach((cell, i) => {
    const value = state.board[i];
    cell.textContent = value || '';
    cell.dataset.value = value;
    cell.className = 'tile' + (value >= 1024 ? ' large' : '') + (value > 2048 ? ' beyond' : '');
    cell.setAttribute('aria-label', `Row ${Math.floor(i / 4) + 1}, column ${i % 4 + 1}: ${value || 'empty'}`);
    if (i === spawned) { void cell.offsetWidth; cell.classList.add('spawn'); }
  });
  document.querySelector('#score').textContent = state.score;
  document.querySelector('#best').textContent = state.best;
  const over = !canMove(state.board);
  document.querySelectorAll('[data-direction]').forEach(button => { button.disabled = over; });
  document.querySelector('#status').textContent = over ? 'No moves left. Try a fresh board.' : (state.board.some(v => v >= 2048) ? '2048 reached!' : '');
  document.querySelector('#new-game').textContent = confirming ? 'Restart?' : 'New game';
  document.querySelector('#cancel').hidden = !confirming;
}
function newGame() {
  state.board = Array(16).fill(0);
  state.score = 0;
  confirming = false;
  spawn(); spawn(); save(); render();
}
function move(direction) {
  const result = slide(state.board, direction);
  confirming = false;
  if (!result.changed) { render(); return; }
  state.board = result.board;
  state.score += result.gained;
  state.best = Math.max(state.best, state.score);
  const spawned = spawn();
  save(); render(spawned);
}
document.querySelectorAll('[data-direction]').forEach(button => button.addEventListener('click', () => move(button.dataset.direction)));
document.addEventListener('keydown', event => {
  const direction = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' }[event.key];
  if (!direction || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
  event.preventDefault();
  move(direction);
});
document.querySelector('#new-game').addEventListener('click', () => {
  if (confirming || !canMove(state.board)) newGame();
  else { confirming = true; render(); }
});
document.querySelector('#cancel').addEventListener('click', () => { confirming = false; render(); document.querySelector('#new-game').focus(); });
try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
  if (saved && saved.version === 1) {
    if (validScore(saved.best)) state.best = saved.best;
    if (validBoard(saved.board) && validScore(saved.score)) {
      state.board = saved.board;
      state.score = saved.score;
      state.best = Math.max(state.best, state.score);
    }
  }
} catch { /* Invalid or inaccessible storage must never prevent playing. */ }
if (state.board.some(Boolean)) { save(); render(); } else newGame();
</script>
</body>
</html>
